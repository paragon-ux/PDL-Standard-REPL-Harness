name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Normative invariant verification (pdlt verify)
        run: uv run pdlt verify

      - name: Anti-overfitting and benchmark integrity gate
        run: uv run pytest tests/test_harness_anti_overfitting.py -v

      - name: Run offline test suite
        run: uv run pytest -m "not slow and not live"

  package-check:
    name: Package Build & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Build distributions (sdist & wheel)
        run: uv build

      - name: Validate distribution metadata with twine
        run: uv run --with twine twine check dist/*

      - name: Verify package data in wheel
        run: |
          python -m zipfile -l dist/*.whl | grep "pdl_taskmaster/contracts/AUTHORITY_MAP.json" || (echo "Missing contract data in wheel!" && exit 1)
          python -m zipfile -l dist/*.whl | grep "pdl_taskmaster/controller/schemas/" || (echo "Missing schemas in wheel!" && exit 1)
          echo "Package data integrity verified."

      - name: Test installation from wheel
        run: |
          uv venv test-env
          uv pip install --python test-env dist/*.whl
          test-env/bin/pdlt --help
          test-env/bin/python -c "import pdl_taskmaster; print('Installed version:', pdl_taskmaster.__version__)"

  ci-gate:
    name: CI Gate Passed
    needs:
      - test
      - package-check
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all checks succeeded
        run: echo "All matrix tests and packaging checks passed successfully."
