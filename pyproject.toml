[build-system]
requires = ["hatchling<1.26.0"]
build-backend = "hatchling.build"

[project]
name = "pdl-taskmaster"
dynamic = ["version"]
description = "Deterministic protocol governance and bounded AI agent harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PDL-Standard Contributors" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "anyio>=4.0.0",
]

[project.scripts]
pdlt = "pdl_taskmaster.host.cli:main"

[tool.hatch.version]
path = "src/pdl_taskmaster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_taskmaster"]
artifacts = [
    "src/pdl_taskmaster/contracts/**/*",
]
exclude = [
    "tests",
    "runs",
    "scratch",
    "*.log",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/pdl_taskmaster",
    "contracts",
    "tests",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "runs",
    "scratch",
    "*.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
